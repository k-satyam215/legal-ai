[project]
name = "legal-ai"
version = "0.1.0"
description = "AI Legal Advisor — India: RAG-based legal guidance for Indian law (FastAPI + FAISS + Groq + Streamlit)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "langchain==0.3.1",
    "langchain-core>=0.3.6,<0.4.0",
    "langchain-community==0.3.1",
    "langchain-text-splitters==0.3.0",
    "langchain-huggingface==0.1.0",
    "groq==1.2.0",
    "faiss-cpu==1.8.0",
    "sentence-transformers==3.1.1",
    "rank-bm25==0.2.2",
    "pymupdf==1.24.10",
    "reportlab==4.2.2",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "streamlit==1.38.0",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "redis==5.0.1",
    "gdown==5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]
